[tool.ruff]
line-length = 100
target-version = "py311"
# The lint set is "everything not listed here" — `ruff check .`. It is NOT an
# enumeration of directories to check: an enumerated set silently omits whatever
# is added next, which is how scripts/ went unlinted from the day it was created
# (tests/test_lint_scope.py). phase0 is the one code exemption: a closed
# historical record of a falsified thesis, frozen by CLAUDE.md, so a lint finding
# there can only be answered by editing a record that must not change.
extend-exclude = [".venv", "data", "reports", "phase0"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line-too-long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A passing test's tmp_path is deleted at session end; only failures keep
# theirs for inspection. With the temp root on disk (tests/conftest.py) this
# bounds the residue to what is worth reading.
tmp_path_retention_policy = "failed"
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:websockets.legacy",
]
